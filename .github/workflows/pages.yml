name: Publish ASTRA TALES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML and embedded JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match || !html.includes('<canvas') || !html.includes('id="app"')) {
            throw new Error('Game entry or embedded JavaScript missing');
          }
          new vm.Script(match[1], {filename: 'game.js'});
          console.log('ASTRA TALES JavaScript syntax OK');
          NODE
      - name: Game regression smoke tests
        run: |
          node tests/touch-navigation.cjs
          node tests/engine.cjs
          node tests/trainer-tactics.cjs
          node tests/companion-bond.cjs
          node tests/trainer-rematches.cjs
          node tests/story.cjs
          node tests/music.cjs
          node tests/creature-art.cjs
          node tests/creature-motion.cjs
          node tests/battle-direction.cjs
          node tests/battle-backdrops.cjs
          node tests/field-sprites.cjs
          node tests/npc-schedules.cjs
          node tests/cinematics.cjs
          node tests/world-detail.cjs
          node tests/terrain-composition.cjs
          node tests/building-profile.cjs
          node tests/visual-polish.cjs
          node tests/map-layout.cjs
          node tests/forest-secrets.cjs
          node tests/region-puzzles.cjs
          node tests/exploration-journal.cjs
          node tests/field-requests.cjs
          node tests/town-legacy.cjs
          node tests/town-workshop.cjs
          node tests/smoke.cjs
          node tests/intro.cjs
      - name: Prepare versioned static site
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          mkdir -p _site
          mkdir -p _site/src
          cp index.html manifest.json icon.svg _site/
          cp src/rpg-engine.js _site/src/
          cp src/touch-navigation.js _site/src/
          cp src/trainer-tactics.js _site/src/
          cp src/companion-bond.js _site/src/
          cp src/trainer-rematches.js _site/src/
          cp src/story.js _site/src/
          cp src/music.js _site/src/
          cp src/creature-art.js _site/src/
          cp src/creature-motion.js _site/src/
          cp src/battle-direction.js _site/src/
          cp src/world-detail.js _site/src/
          cp src/terrain-composition.js _site/src/
          cp src/building-profile.js _site/src/
          cp src/visual-polish.js _site/src/
          cp src/map-layout.js _site/src/
          cp src/forest-secrets.js _site/src/
          cp src/region-puzzles.js _site/src/
          cp src/exploration-journal.js _site/src/
          cp src/field-requests.js _site/src/
          cp src/town-legacy.js _site/src/
          cp src/town-workshop.js _site/src/
          cp src/battle-backdrops.js _site/src/
          cp src/field-sprites.js _site/src/
          cp src/npc-schedules.js _site/src/
          cp src/cinematics.js _site/src/
          sed -i "s/__BUILD_ID__/$BUILD_ID/g" _site/index.html
          if grep -q "__BUILD_ID__" _site/index.html; then exit 1; fi
          touch _site/.nojekyll
          printf '{"buildId":"%s"}\n' "$BUILD_ID" > _site/version.json
          cat > _site/latest.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA TALES - Latest</title></head>
          <body style="background:#102930;color:#f4ebc8;font-family:sans-serif;text-align:center;padding:3rem">最新版を開いています…<script>
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.filter(r=>r.scope.includes('/newgame5/')).map(r=>r.unregister()))).finally(()=>location.replace('./?v='+Date.now()));
          else location.replace('./?v='+Date.now());
          </script></body></html>
          EOF
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
