body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:radial-gradient(ellipse at top,#244a52 0%,#081519 85%);color:var(--paper);user-select:none;-webkit-user-select:none}

#console[data-mode="battle"] .options button.primary{background:#c64c48;border-color:#9e4b52;color:#fff7e5}

.dkey{position:absolute;width:54px;height:49px;display:grid;place-items:center;background:linear-gradient(#436368,#29444b);border:2px solid #66888a;color:#dfebdf;font-size:22px;font-weight:900;box-shadow:0 4px #07171e;border-radius:8px;touch-action:none}

.dkey[data-dir=up]{top:0;left:51px}.dkey[data-dir=down]{bottom:0;left:51px}
.dkey[data-dir=left]{top:50px;left:0}.dkey[data-dir=right]{top:50px;right:0}

.round:active{transform:translateY(2px);box-shadow:0 2px #581f26}
#bBtn{grid-column:1;grid-row:2;background:#456b7d;border-color:#779daf;box-shadow:0 4px #183b53;width:53px;height:53px}
#aBtn{grid-column:2;grid-row:1}
#menuBtn{grid-column:1/3;grid-row:3;background:#20393d;border:1px solid #729188;border-radius:12px;font-size:10px;padding:5px 15px;letter-spacing:1px}
#toast{position:absolute;bottom:20px;left:16px;right:16px;margin:auto;max-width:390px;border:2px solid #afbb9d;background:#243b3edb;color:#f1f5df;font-size:13px;border-radius:8px;padding:10px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
footer{flex:none;text-align:center;font-size:9px;color:#819a95;letter-spacing:.05em}

function beep(f=440,t=.09,type='sine',volume=.04){
 if(!soundOn)return;
 try{
  const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
  if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);
  g.gain.setValueAtTime(Math.max(.0001,volume),ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+t+.01);
 }catch(e){}
}
function soundtrack(){

 if(!ac||ac.state==='suspended')return;
 if(!music)try{music=globalThis.AstraMusic.create(ac)}catch(e){return}
 const b=state.battle;
 const map=state.map;
 const theme=b?(b.npc?.kind==='boss'?'boss':b.npc?.kind==='rival'?'rival':'battle'):
 (state.scene==='title'||state.scene==='starter'?'title':
 (map==='bedroom'||map==='home'?'home':
 ['center','mart','village'].includes(map)?'village':
 map==='lab'?'lab':map==='observatory'?'lake':map));
 music.setTrack(theme);music.tick();
}

 else if(name==='bad'){beep(140,.16,'sawtooth',.026);beep(95,.22,'triangle',.025)}
 else if(name==='walk'){beep(state.steps%2?83:99,.019,'triangle',.008)}
 else if(name==='catch'){beep(660,.17,'sine',.038);setTimeout(()=>beep(890,.19,'triangle',.034),190)}
 else if(name==='attack'){
  const types={火:[290,500,'sawtooth'],水:[405,240,'sine'],草:[370,590,'triangle'],雷:[690,260,'square'],風:[455,680,'triangle'],岩:[125,230,'triangle'],影:[190,385,'sawtooth'],光:[630,925,'sine'],無:[260,400,'triangle']};
  const [low,high,wave]=types[detail]||types['無'];
  beep(low,.085,wave,.028);setTimeout(()=>beep(high,.13,wave,.023),45);
 }else beep(320,.07,'triangle',.026);

function enemyFreeTurn(){
 const b=state.battle;if(!b)return;
 if(b.tutorial){showBattle('大丈夫、ゆっくり星玉を選んでね。');return}
 b.turn++;
 const m=foe(),target=current(),name=enemyMove(m),skip=Engine.skipStatus(m);
 if(skip){battleMessage(byId[m.id].name+(skip==='ねむり'?' は眠っている…':' はまひで動けなかった！'),()=>takeTurns([],0),700);return}
 if(name!=='わるあがき'&&m.pp?.[name]>0)m.pp[name]=Math.max(0,m.pp[name]-(Engine.abilityFor(target)==='プレッシャー'?2:1));
 b.action={who:'enemy',name,started:performance.now()};
 const r=combatDamage(m,target,name);b.shake=12;beep(180,.1,'square');
 battleMessage(r.text,()=>{
  if(target.hp<=0)knockout();
  else if(m.hp<=0)defeatEnemy();
  else takeTurns([],0);
 },750);
}

function throwOrb(){const b=state.battle;if(!b)return;
if(storyStage()<12&&!b.tutorial){showBattle('まだ星玉の扱いを教わっていない！');return}
if(b.trainer){showBattle('トレーナーの星霊は捕まえられない！');return}
if(state.party.length>=6&&!state.boxes.some(b=>b.members.length<30)){showBattle('パーティとボックスがいっぱいだ！');return}
if(state.bag.orb<=0){battleBag();return}
state.bag.orb--;const m=foe(),health=1-m.hp/m.maxHp;
const chance=Engine.catchProbability(m,byId);
b.capture={started:performance.now(),success:b.tutorial||Math.random()<chance};sfx('catch');
battleMessage('星玉を投げた！ '+byId[m.id].name+' を捕まえられるかな…',()=>{
const caught=b.capture?.success;b.capture=null;
if(caught){
const boxName=state.party.length<6?null:Engine.putInStorage(state.boxes,m);
if(!boxName)state.party.push(m);
state.caught[m.id]=(state.caught[m.id]||0)+1;
 const tutorialComplete=b.tutorial&&storyStage()===11;
 if(tutorialComplete){storyStep(12);state.events.captureTutorialComplete=true}
 resetBattleStats();state.battle=null;save();sfx('catch');
 dialog('CAPTURE','カチッ！ '+byId[m.id].name+' をゲット！'+(boxName?'\nパーティがいっぱいなので '+boxName+' に預けた。':'')+
 (tutorialComplete?'\n\nナギ「やったね！ これで自分の力で仲間を増やせるよ！」':''),[{text:'▶ 冒険へ',on:()=>world()}]);}
else battleMessage('ああっ！ 星玉から飛び出した！',enemyFreeTurn,850);
},1850);}

function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fill()}
function line(x,y,x2,y2,col,w=2){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(str,x,y,size=12,col='#fff',align='left'){ctx.fillStyle=col;ctx.font='bold '+size+'px system-ui,sans-serif';ctx.textAlign=align;ctx.fillText(str,x,y);ctx.textAlign='left'}

function drawHero(x,y,dir){
 // Separate idle, moving, and sprint cycles. Pixel shapes remain readable at 32px scale.
 const tween=posTween(movement),active=!!tween&&tween.t<.995,phase=active?tween.t*Math.PI*4:0;
 const stride=active?Math.sin(phase)*(state.running?5:3.5):0;
 const bounce=active?Math.abs(Math.sin(phase))*(state.running?2.8:1.6):Math.sin(frame*.045)*.55;
 const sway=active?Math.sin(phase)*1.2:0;
 const x0=Math.round(x+sway*.25),y0=Math.round(y-bounce);
 ellipse(x,y+13,active?11:9,4,'#253b3c73');
 // Two alternating leg silhouettes including visible knee lift.
 pixel(x0-7+stride*.25,y0+6,5,10+Math.max(0,stride)*.18,'#3b435c');
 pixel(x0+2-stride*.25,y0+6,5,10+Math.max(0,-stride)*.18,'#3b435c');
 pixel(x0-8+stride*.45,y0+14,7,3,'#323640');
 pixel(x0+1-stride*.45,y0+14,7,3,'#323640');
 // Backpack, moving arms and torso.
 pixel(x0-10,y0-12,20,19,dir==='up'?'#59788d':'#466c98');
 pixel(x0-12,y0-10-stride*.42,5,12,'#c49173');
 pixel(x0+7,y0-10+stride*.42,5,12,'#c49173');
 pixel(x0-7,y0-8,14,13,dir==='down'?'#4e79a7':'#49749b');
 pixel(x0-4,y0+1,8,3,'#dcba7e');
 // Distinct silhouettes in all four directions.
 pixel(x0-7,y0-23,14,14,dir==='up'?'#484957':'#edc8a4');
 if(dir==='up'){
  pixel(x0-7,y0-24,14,9,'#555c69');pixel(x0-4,y0-17,8,6,'#4b5667');
  pixel(x0-5,y0-8,10,8,'#c28b59');
 }else if(dir==='down'){
  pixel(x0-7,y0-24,14,6,'#523e48');
  pixel(x0-4,y0-16,2,2,'#273f4f');pixel(x0+3,y0-16,2,2,'#273f4f');
  pixel(x0-2,y0-11,4,2,'#b77670');
 }else{
  pixel(x0-8,y0-24,16,6,'#523e48');
  pixel(x0+(dir==='left'?-7:5),y0-16,2,3,'#273f4f');
  pixel(x0+(dir==='left'?-12:9),y0-7,4,10,'#bb936a');
 }
 // Cap top and rim are the recognizable character accent.
 pixel(x0-8,y0-27,16,7,'#b64e54');
 pixel(x0-10+(dir==='left'?-3:dir==='right'?3:0),y0-23,20,3,'#db6d64');
 if(active&&state.running){
  pixel(x-15,y+10,3,2,'#e6e0c299');pixel(x+12,y+11,3,2,'#e6e0c299');
 }
}
function posTween(step){
if(!step)return null;const t=clamp((performance.now()-step.start)/(step.duration||142),0,1),ease=t*t*(3-2*t);
return {x:step.fromX+(step.toX-step.fromX)*ease,y:step.fromY+(step.toY-step.fromY)*ease,t};
}
// Local real-time day/evening/night phases, rather than a rapid demo loop.
function worldPhase(){
const hour=new Date().getHours();
if(hour>=20||hour<4)return 2;
if(hour>=17&&hour<20)return 1;
return 0;
}

function drawMonster(m,x,y,scale=1,back=false){

function draw(){
frame++;
if(frame%3===0)soundtrack();
if(holdDir&&state.scene==='world'&&performance.now()-lastStep>(state.running?88:145)){walk(holdDir);lastStep=performance.now()}
if(state.scene==='battle')drawBattle();
else if(state.scene==='dialog'&&state.previewStarter)drawStarterPreview();
else if(state.scene==='title'||state.scene==='starter'||state.scene==='help')drawTitle();
else if(state.scene==='menu'&&state.menuPage==='dex'&&state.dexFocus)drawDexPreview();
else if(state.scene==='menu'&&state.menuPage==='party'&&Number.isInteger(state.partyFocus))drawPartyPreview();
else drawWorld();
if(state.scene!=='title'&&state.scene!=='starter')state.time+=1/60;
requestAnimationFrame(draw)}
function init(){
 $('#audioBtn').textContent=soundOn?'♫ ON':'♫ OFF';
 title();requestAnimationFrame(draw);

  if(document.hidden){save();if(music)music.setMuted(true)}
  else if(music)music.setMuted(!soundOn);
 });
 window.addEventListener('pagehide',()=>{save();if(music)music.setMuted(true)});
}
init();
})();
