<style>

</head>

];
const byId=Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const MOVES={

'あわガード':{effect:'guard'}};
const ADV={火:['草'],草:['水','岩'],水:['火','岩'],雷:['水','風'],風:['草'],岩:['風','火'],光:['影'],影:['光']};
const RES={火:['水','岩'],水:['草','雷'],草:['火','風'],風:['岩'],雷:['岩'],影:['光']};
function effectiveness(a,b){return (ADV[a]||[]).includes(b)?1.5:(RES[a]||[]).includes(b)?0.7:1}
const dirDelta={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const mapMeta={
village:{name:'ミナモリの町',w:24,h:20,theme:'village',wild:[]},
route:{name:'そよかぜの小道',w:24,h:26,theme:'route',wild:[['chiro',3],['koro',3],['fugale',4],['sparkit',6]]},
forest:{name:'月影の森',w:28,h:28,theme:'forest',wild:[['lumin',5],['puddlo',6],['shade',7],['orchid',7],['crag',8]]},

const maps={};
function makeMap(id){

if(m.theme==='interior'){
  const arr=Array.from({length:m.h},(_,y)=>Array.from({length:m.w},(_,x)=>{
    if(y===0||x===0||x===m.w-1)return 5;

  }));
  const row=(y,x1,x2,t)=>{for(let x=x1;x<=x2;x++)arr[y][x]=t};
  if(id==='center'){row(3,4,9,8);arr[4][2]=11;arr[4][11]=11;row(6,2,4,10);row(6,9,11,10)}
  if(id==='mart'){row(3,4,9,8);row(4,2,3,9);row(5,2,3,9);row(4,10,11,9);row(5,10,11,9)}
  if(id==='lab'){row(4,5,10,8);row(6,2,4,9);row(6,11,13,9);arr[8][3]=11;arr[8][12]=11}
  maps[id]=arr;return;
}
const a=Array.from({length:m.h},(_,y)=>Array.from({length:m.w},(_,x)=>{
if(x<2||y<2||x>=m.w-2||y>=m.h-2)return 4;
let r=rand(x,y,id.length);
if(id==='village')return r<.065?7:0;
if(id==='shrine')return r<.08?7:(r<.2?2:0);
if(id==='lake')return r<.16?7:r<.38?2:0;
if(id==='highland')return r<.04?7:r<.40?2:0;
return r<.28?2:(r<.38?7:0);
}));
function rect(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(a[j]&&a[j][i]!==undefined)a[j][i]=v}

rect(9,0,5,20,1);rect(4,9,17,4,1);rect(5,5,5,4,1);rect(14,5,5,4,1);

}

case 'dragon':ellipse(0,-5,37,42,body);ear(-21,-48,12,22);ear(21,-48,12,22);ellipse(-35,-13,17,36,light);ellipse(35,-13,17,36,light);mark(0,-2,22,22);break;
}
ellipse(-11,-22,4.5,5.5,'#203b44');ellipse(11,-22,4.5,5.5,'#203b44');ellipse(-12,-24,1.5,2,'#ffffff');ellipse(10,-24,1.5,2,'#ffffff');
ellipse(0,-10,3,2,'#744e54');ctx.restore()}
function drawBar(x,y,w,val,col){rounded(x,y,w,9,4,'#49616b');rounded(x+2,y+2,Math.max(0,(w-4)*clamp(val,0,1)),5,3,col)}
function drawBattle(){
const b=state.battle;if(!b){drawWorld();return}
const m=foe(),mine=current(),theme=mapMeta[state.map].theme,forest=theme==='forest',shrine=theme==='shrine';
const back=ctx.createLinearGradient(0,0,0,H);
back.addColorStop(0,shrine?'#333d61':forest?'#8bb5a5':'#96c7dc');
back.addColorStop(.56,shrine?'#8b8ca6':forest?'#d5d8ac':'#ebedc6');
back.addColorStop(1,shrine?'#707b96':'#7cac80');
ctx.fillStyle=back;ctx.fillRect(0,0,W,H);
// Distant clouds and forest silhouette; separate camera depths for a layered RPG battleback.

ellipse(xx,yy,36,10,'#f3f5df66');ellipse(xx+25,yy-4,23,9,'#fcf9e488');

 const xx=i*38-10,y=136+(i%4)*7;

 else{ellipse(xx,y-21,26,35,forest?'#699282':'#83b48a');ellipse(xx-10,y-36,20,22,forest?'#638d81':'#80a783');pixel(xx-4,y,8,24,'#5e8576')}
}
pixel(0,146,W,H-146,shrine?'#a5a79f':'#97bd85');
for(let i=0;i<9;i++)ellipse(i*60-10,161+(i%3)*14,65,14,shrine?'#8b958e':'#89ae7f');
// Field platforms are offset in depth to emphasize two distinct battle positions.
ellipse(307,196,131,29,shrine?'#c0b9a4':'#c2c99f');
ellipse(307,199,109,20,shrine?'#899a96':'#8fae84');
ellipse(103,340,161,39,shrine?'#b5b1ad':'#aec39d');
ellipse(103,342,133,29,shrine?'#8b9794':'#81aa87');
for(let i=0;i<12;i++){const x=(i*47+19)%W,y=189+(i%5)*31;pixel(x,y,3,2,shrine?'#dad6b6':'#dce5a5')}
if(shrine){for(let i=0;i<16;i++){const x=rand(i,47)*W,y=rand(i,17)*210;ellipse(x,y,2,2,'#f1e9bc88')}}
const t=b.action?clamp((performance.now()-b.action.started)/760,0,1):1;
const attacking=t<1,bFrom=b.action?.who==='you';
const surge=attacking?Math.sin(Math.PI*t)*15:0;
const oursX=105+(attacking&&bFrom?surge:0),foeX=307-(attacking&&!bFrom?surge:0);
const hit=!(!attacking||t<.37||t>.72);
const shake=hit&&b.shake>0?Math.sin(t*82)*5:0;
const cap=b.capture?clamp((performance.now()-b.capture.started)/1850,0,1):null;
if(cap===null||cap<.44){
 const targetOffset=(hit&&bFrom?shake:0);
 drawMonster(m,foeX+targetOffset,190,1.01,false);
}
const ourOffset=(hit&&!bFrom?shake:0);
drawMonster(mine,oursX+ourOffset,326,1.36,true);
if(attacking){
 const move=MOVES[b.action.name]||{type:'無'};
 const cols={火:['#f8d17a','#e66a4a'],水:['#c6f2ec','#539fc9'],草:['#d0eba2','#569d61'],雷:['#fff2a5','#e1b73e'],風:['#e5f6e7','#98bdc9'],岩:['#e0d2b4','#95816a'],影:['#ccb0e9','#725891'],光:['#fff7d5','#d9bb85'],無:['#e1e7d7','#9bb5b6']};
 const cc=cols[move.type||byId[(bFrom?mine:m).id].type]||cols['無'];
 const sx=bFrom?oursX+17:foeX-12,sy=bFrom?256:165;
 const ex=bFrom?foeX-20:oursX+18,ey=bFrom?159:270;
 for(let i=0;i<11;i++){const p=clamp(t*1.5-i*.075,0,1);if(p<=0||p>=1)continue;
 const xx=sx+(ex-sx)*p,yy=sy+(ey-sy)*p+Math.sin(p*18+i)*12,rr=(1-p)*7+2;
 ellipse(xx,yy,rr,rr,cc[i%2]);
 }
 if(t>.42&&t<.82){for(let k=0;k<7;k++){const a=frame*.24+k*6.28/7,r=15+(t-.42)*58;line(ex+Math.cos(a)*r,ey+Math.sin(a)*r,ex+Math.cos(a)*(r+10),ey+Math.sin(a)*(r+10),cc[k%2],3)}}
}
if(cap!==null){
 const p=cap,fromX=170,toX=307,orbX=fromX+(toX-fromX)*clamp(p/.42,0,1);
 let orbY=210-Math.sin(clamp(p/.42,0,1)*Math.PI)*108;
 if(p>=.42){orbY=194+Math.sin(frame*.3)*(1-p)*3}
 if(p>.60){const wiggle=Math.sin(frame*.33)*((1-p)*18);ellipse(orbX+wiggle,orbY,12,12,'#4e6472');ellipse(orbX+wiggle,orbY-3,12,9,'#ef796a');pixel(orbX+wiggle-11,orbY-1,22,4,'#ecdfc5');ellipse(orbX+wiggle,orbY,4,4,'#f1eaba')}
 else{ellipse(orbX,orbY,12,12,'#405d70');ellipse(orbX,orbY-3,12,9,'#e65f5a');pixel(orbX-11,orbY-1,22,4,'#f1e8d2');ellipse(orbX,orbY,4,4,'#e9f5e5')}
 if(p>.44&&p<.7)for(let j=0;j<11;j++){const a=j*.57+frame*.01;ellipse(toX+Math.cos(a)*(9+frame%14),195+Math.sin(a)*(9+frame%14),2,2,'#f4e7ad')}
}
// Each status pane uses a nameplate, level badge, health gauge and condition indicator.
rounded(12,14,198,68,10,'#50676c');
rounded(16,18,190,60,7,'#f4f1dd');
pixel(16,18,190,4,'#d5e0c4');
txt(byId[m.id].name,25,39,14,'#243e43');
txt('Lv '+m.level,192,38,12,'#31474e','right');
rounded(24,46,172,22,6,'#d7dfca');
txt('HP',30,61,10,'#6e8577');
drawBar(54,52,138,m.hp/m.maxHp,m.hp/m.maxHp<.28?'#e88d71':m.hp/m.maxHp<.5?'#ddc56d':'#84bc89');
if(m.status)txt(m.status,154,75,10,'#8e5869','right');
rounded(213,263,193,80,10,'#536e70');
rounded(217,267,185,72,7,'#f7f1df');
pixel(217,267,185,4,'#d5e4d2');
txt(byId[mine.id].name,228,287,14,'#243e43');
txt('Lv '+mine.level,392,287,12,'#31474e','right');
rounded(228,294,164,23,6,'#d9e3ce');
txt('HP',234,310,10,'#69847a');
drawBar(259,299,129,mine.hp/mine.maxHp,mine.hp/mine.maxHp<.28?'#e88d71':mine.hp/mine.maxHp<.5?'#ddc56d':'#84bc89');
txt(''+mine.hp+' / '+mine.maxHp,385,329,11,'#31464d','right');
drawBar(231,332,155,(mine.xp||0)/(mine.level*19),'#7aa9cf');
if(mine.status)txt(mine.status,267,327,10,'#a45e72');
rounded(12,92,84,19,4,'#29434d99');
txt(b.trainer?'TRAINER':'WILD STAR',19,105,9,'#fff5db');
if(b.enemies.length>1){for(let i=0;i<b.enemies.length;i++){ellipse(110+i*15,101,5,5,i<b.index?'#586b68':'#f2dfaf');ellipse(110+i*15,99,4,3,i<b.index?'#808f84':'#e9a175')}}
b.shake=Math.max(0,b.shake-1);
}
function drawTitle(){
const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#152d43');gr.addColorStop(1,'#567a74');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
for(let i=0;i<42;i++){const x=rand(i,2,4)*W,y=rand(i,3,4)*H*.72;ellipse(x,y,rand(i,1)*2+1,rand(i,1)*2+1,'#f0e7bc')}

txt('ASTRA TALES',208,64,30,'#f8eac6','center');txt('星　霊　譚',208,100,23,'#fff3d0','center');

function draw(){
frame++;
if(holdDir&&state.scene==='world'&&performance.now()-lastStep>(state.running?88:145)){walk(holdDir);lastStep=performance.now()}
if(state.scene==='battle')drawBattle();else if(state.scene==='title'||state.scene==='starter'||state.scene==='help')drawTitle();else drawWorld();
if(state.scene!=='title'&&state.scene!=='starter')state.time+=1/60;
requestAnimationFrame(draw)}
