function beep(f=440,t=.09,type='sine',volume=.04){
 if(!soundOn)return;
 try{
  const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
  if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);
  g.gain.setValueAtTime(Math.max(.0001,volume),ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+t+.01);
 }catch(e){}
}

 (map==='bedroom'||map==='home'?'home':

}

 if(b.tutorial){showBattle('大丈夫、ゆっくり星玉を選んでね。');return}
 b.turn++;
 const m=foe(),target=current(),name=enemyMove(m),skip=Engine.skipStatus(m);

 const previousHp=target.hp;
 b.action={who:'enemy',name,started:performance.now(),target:'ally',previousHp};
 const r=combatDamage(m,target,name);
 Object.assign(b.action,{damage:r.damage||0,critical:!!r.critical,efficacy:r.efficacy||1,miss:!!r.miss});
 b.shake=r.damage>0?12:0;beep(180,.1,'square');
 battleMessage(r.text,()=>{

 },750);
}

function throwOrb(){const b=state.battle;if(!b)return;

state.bag.orb--;const m=foe(),health=1-m.hp/m.maxHp;
const chance=Engine.catchProbability(m,byId);
b.capture={started:performance.now(),success:b.tutorial||Math.random()<chance};sfx('catch');
battleMessage('星玉を投げた！ '+byId[m.id].name+' を捕まえられるかな…',()=>{
const caught=b.capture?.success;b.capture=null;

 if(tutorialComplete){storyStep(12);state.events.captureTutorialComplete=true;startStoryEffect('cheer','旅の友 ナギ',1800)}
 resetBattleStats();state.battle=null;save();sfx('catch');
 dialog('CAPTURE','カチッ！ '+byId[m.id].name+' をゲット！'+(boxName?'\nパーティがいっぱいなので '+boxName+' に預けた。':'')+
 (tutorialComplete?'\n\nナギ「やったね！ これで自分の力で仲間を増やせるよ！」':''),[{text:'▶ 冒険へ',on:()=>world()}]);}
else battleMessage('ああっ！ 星玉から飛び出した！',enemyFreeTurn,850);
},1850);}

    const col=variant<.3?'#e9b2ca':variant<.68?'#ffe4a6':'#dae8ef';
    for(let i=0;i<5;i++){const theta=i*Math.PI*2/5;ellipse(sx+13+Math.cos(theta)*4,sy+21+Math.sin(theta)*4,2.6,2.6,col)}
    ellipse(sx+13,sy+21,2,2,'#efc45c');
   }else if(seed<.47&&name==='forest'){
    pixel(sx+10,sy+22,4,6,'#e6cda7');
    ellipse(sx+12,sy+22,8,4,variant>.5?'#bd7471':'#d2b37d');
    pixel(sx+9,sy+21,2,1,'#fff1c5');
   }else if(seed>.92&&(name==='highland'||name==='shrine')){
    const shimmer=(Math.sin(frame*.052+tx*2+ty)+1)/2;
    line(sx+15,sy+23,sx+16,sy+9,'#b3d4d6',2);
    line(sx+16,sy+9,sx+21,sy+16,'#d8e6ca',2);
    ellipse(sx+15,sy+12,2+shimmer,3+shimmer,'#f5e7b4ab');
   }
   if(name==='village'&&seed>.89){
    pixel(sx+4,sy+23,24,4,'#b8ae8766');
    pixel(sx+6,sy+11,3,16,'#88694c');
    pixel(sx+23,sy+11,3,16,'#88694c');
    line(sx+6,sy+14,sx+26,sy+14,'#d0b88c',3);
   }
  }else if(tile===1&&meta.theme!=='interior'&&seed>.92){
   // Pebble accents stay flat and never conceal passable paths.
   ellipse(sx+11,sy+23,3.5,2,'#927e68');
   ellipse(sx+23,sy+7,2,1.2,'#f7e2bd');
  }else if(tile===3&&name==='lake'&&seed>.65){
   const ripple=Math.sin(frame*.05+tx+ty)*2;
   line(sx+5,sy+13+ripple,sx+17,sy+13+ripple,'#bee5d5a8',1.6);
   line(sx+14,sy+17+ripple,sx+26,sy+17+ripple,'#a7d0d6a9',1.4);
   if(seed>.87){line(sx+25,sy+27,sx+23,sy+12,'#85aa75',2);ellipse(sx+23,sy+12,2.5,5,'#b6c999')}
  }
 }
}

function beginCharacterBeat(name,opts={}){
 const actor=(NPCS[state.map]||[]).find(n=>n.name===name&&isNpcVisible(n));
 const entry=!!opts.entry;
 const end=actor?{x:actor.x,y:actor.y}:
    {x:state.x+(opts.offsetX??1),y:state.y+(opts.offsetY??-1)};
 let start=actor?{...end}:
    {x:end.x+(opts.startX??0),y:end.y+(opts.startY??-2)};
 if(actor){
  const tiles=maps[state.map],dx=Math.sign(actor.x-state.x),dy=Math.sign(actor.y-state.y);
  const candidates=[
   {x:actor.x+dx,y:actor.y+dy},{x:actor.x-dy,y:actor.y+dx},
   {x:actor.x+dy,y:actor.y-dx},{x:actor.x+1,y:actor.y},{x:actor.x-1,y:actor.y}
  ];
  const found=candidates.find(p=>!(p.x===state.x&&p.y===state.y)&&
    Schedules.isPassable(tiles,p.x,p.y)&&
    !(NPCS[state.map]||[]).some(n=>n!==actor&&isNpcVisible(n)&&n.x===p.x&&n.y===p.y));
  if(found)start=found;
 }
 characterBeat=Cinematics.make({map:state.map,name,start,end,focus:entry?end:{x:(end.x+state.x)/2,y:(end.y+state.y)/2},
   duration:opts.duration||1800,hold:true,emote:opts.emote||'surprise',
   costume:actor?.kind||opts.costume||'trainer',
   facing:entry?'up':actor?.facing||'down'},performance.now());
 return characterBeat;
}
function cinematicFrame(){
 return Cinematics.sample(characterBeat,performance.now(),state.map,state.scene==='dialog');
}

  const mark=r.status==='complete'?'★':r.status==='ready'?'!':r.status==='active'?'◇':visible?'✉':'?';
  rounded(55,y+6,37,36,4,r.status==='ready'?'#cfaa60':r.status==='complete'?'#8da88f':'#b1aa97');
  txt(mark,73,y+31,22,'#fdf5dd','center');txt(visible?r.title:'未確認の便り',102,y+21,14,'#456263');
  txt(r.statusText,103,y+37,10,'#8a7b67');
 });
 txt('COMPLETED '+done+'/'+rows.length+'  ·  READY '+ready,W/2,332,11,'#f2e4c7','center');
}
/* Decorations follow completed reports; they never alter tile collision or exits. */
function drawWorkshopFacade(camX,camY){
 if(Workshop.townTier(state)<2)return;
 const x=15-camX,y=5*T-camY;
 if(x<-140||x>W+80||y>H+120||y<-160)return;
 pixel(x+7,y+55,108,47,'#c8c6ae');pixel(x+5,y+94,112,8,'#6f8079');
 pixel(x,y+42,123,15,'#758b92');rounded(x+8,y+20,108,27,5,'#688b95');
 rounded(x+20,y+11,86,14,5,'#a7c9bb');
 for(let k=0;k<5;k++)line(x+10+k*24,y+35,x+25+k*23,y+35,'#d8e1d5',2);
 rounded(x+74,y+69,33,33,2,'#526f7a');rounded(x+79,y+76,24,25,2,'#a0acaa');
 pixel(x+90,y+84,4,10,'#e9d5ae');
 for(const dx of [23,47]){rounded(x+dx,y+67,15,22,2,'#4a7184');pixel(x+dx+3,y+70,9,13,'#b7d7c9')}
 rounded(x+26,y+48,67,11,3,'#e4d2a8');txt('✦ WORKSHOP',x+59,y+57,9,'#58716a','center');
 if(Workshop.townTier(state)>=4){ellipse(x+59,y+10,15,8,'#d4d2a5');txt('✦',x+59,y+15,13,'#638d82','center')}
}
function drawTownLegacy(camX,camY){
 if(state.map!=='village')return;
 const level=TownLegacy.snapshot(state).tier;
 if(level<1)return;
 const at=(x,y)=>({x:x*T-camX+16,y:y*T-camY+13});
 const inView=p=>p.x>-72&&p.x<W+72&&p.y>-80&&p.y<H+80;
 const square=at(12,11);
 if(inView(square)){
  ellipse(square.x,square.y+11,44,15,'#af936c');
  ellipse(square.x,square.y+9,36,11,'#e6d7b7');
  for(let k=0;k<4;k++){
   const a=k*Math.PI/2+Math.PI/4;
   ellipse(square.x+Math.cos(a)*26,square.y+9+Math.sin(a)*7,6,2.8,'#b08b62');
  }
  ellipse(square.x,square.y+8,11,6,'#7babb0');
  txt('✦',square.x,square.y+13,13,'#f5e1a2','center');
 }
 if(level>=2){
  for(const [gx,gy] of [[9,11],[16,12]]){
   const p=at(gx,gy);
   if(!inView(p))continue;
   rounded(p.x-15,p.y+6,30,7,3,'#826954');
   for(let i=0;i<3;i++){const px=p.x-10+i*10;line(px,p.y+7,px,p.y-1,'#497c5d',2);ellipse(px,p.y-3,3.4,3.2,i%2?'#dbcae9':'#f5c8af')}
  }
 }
 if(level>=3){
  for(const [gx,gy] of [[10,9],[15,9]]){
   const p=at(gx,gy);if(!inView(p))continue;
   const shine=(Math.sin(frame*.038+gx)+1)*.5;
   ellipse(p.x,p.y+10,9,4,'#7e7463b3');
   pixel(p.x-2,p.y-14,4,23,'#a98c68');
   ellipse(p.x,p.y-16,7+shine*2,9+shine*2,'#e6c58bb8');
   ellipse(p.x,p.y-16,3.5,6,'#fff3c9');
  }
 }
 if(level>=4){
  const p=at(12,9);
  if(inView(p)){
   line(p.x-105,p.y-33,p.x+105,p.y-35,'#e9dfc4',2);
   for(let i=0;i<9;i++){
    const x=p.x-96+i*24,y=p.y-32+Math.sin(frame*.035+i)*1.5;
    ctx.fillStyle=['#bb979e','#84b6ac','#e9cd8e'][i%3];
    ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.lineTo(x,y+15);ctx.closePath();ctx.fill();
   }
  }
 }
 if(level>=5&&inView(square)){
  for(let i=0;i<10;i++){
   const a=frame*.011+i*Math.PI/5;
   ellipse(square.x+Math.cos(a)*43,square.y-9+Math.sin(a)*22,2.2,2.2,'#fff0baad');
  }
  txt('✧',square.x,square.y-15,20,'#f8e2aa','center');
 }
}
function drawTownRecordPage(){
 const p=TownLegacy.snapshot(state);
 const gradient=ctx.createLinearGradient(0,0,W,H);gradient.addColorStop(0,'#426b70');gradient.addColorStop(1,'#809b7a');
 ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 rounded(23,20,W-46,H-40,13,'#b48f64');rounded(31,27,W-62,H-54,10,'#f2e5c9');
 txt('✦  MINAMORI CHRONICLE  ✦',W/2,62,18,'#54736d','center');
 pixel(56,74,W-112,2,'#c4aa84');
 txt(p.tierName,W/2,110,19,'#4c706f','center');
 for(let i=0;i<4;i++){
  const x=71+i*91,complete=i<p.count;
  ellipse(x,170,27,27,complete?'#93bba9':'#bfc0b1');
  ellipse(x,170,20,20,complete?'#e8eee0':'#ded7c4');
  txt(complete?'✦':'?',x,178,27,complete?'#568074':'#9a8c76','center');
  if(i<3)line(x+30,170,x+60,170,'#c0b49a',3);
 }
 txt('地域の報告：'+p.count+' / '+p.total,W/2,230,15,'#6f796b','center');
 txt(p.status==='complete'?'★ 星の記録祭 完成 ★':p.status==='ready'?'記録係に成果を届けよう':
  p.status==='available'?'広場の記録係に話しかけよう':
  p.status==='active'?'旅の記録を集め続けよう':'各地を旅して調査を始めよう',W/2,274,12,'#7b8073','center');
 txt('調査の成果で町の景色が変わる',W/2,322,11,'#95866b','center');
}
function drawTitle(){
const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#152d43');gr.addColorStop(1,'#567a74');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
for(let i=0;i<42;i++){const x=rand(i,2,4)*W,y=rand(i,3,4)*H*.72;ellipse(x,y,rand(i,1)*2+1,rand(i,1)*2+1,'#f0e7bc')}
ellipse(208,126,82,82,'#f3dba38c');ellipse(208,126,64,64,'#f2dfa49c');
for(let i=0;i<4;i++){ellipse(50+i*110,335,95,93,['#345e55','#407262','#49715b','#2a5b55'][i])}
drawMonster(makeMonster('flamio',5),99,286,.82);drawMonster(makeMonster('leafin',5),208,284,.85);drawMonster(makeMonster('aquill',5),317,286,.82);
txt('ASTRA TALES',208,64,30,'#f8eac6','center');txt('星　霊　譚',208,100,23,'#fff3d0','center');
txt('− STARBOUND ADVENTURE −',208,322,11,'#e7f1e4','center');
}
function draw(){
frame++;
if(frame%3===0)soundtrack();
ambientNpcStep();
if(holdDir&&state.scene==='world'&&performance.now()-lastStep>(state.running?88:145)){walk(holdDir);lastStep=performance.now()}
if(state.scene==='battle')drawBattle();
else if(state.scene==='dialog'&&state.previewStarter)drawStarterPreview();
else if(state.scene==='title'||state.scene==='starter'||state.scene==='help')drawTitle();
else if(state.scene==='menu'&&state.menuPage==='atlas')drawFieldAtlas();
else if(state.scene==='menu'&&state.menuPage==='townLegacy')drawTownRecordPage();
else if(state.scene==='menu'&&(state.menuPage==='requests'||state.menuPage==='requestDetail'))drawRequestBoard();
else if(state.scene==='menu'&&(state.menuPage==='exploration'||state.menuPage==='explorationDetail'))drawExplorationScreen();
 else if(state.scene==='menu'&&state.menuPage==='dex'&&state.dexFocus)drawDexPreview();
else if(state.scene==='menu'&&state.menuPage==='party'&&Number.isInteger(state.partyFocus))drawPartyPreview();
else drawWorld();
if(state.scene!=='title'&&state.scene!=='starter')state.time+=1/60;
if(state.scene!=='title'&&state.scene!=='starter'){drawStoryEffect();drawMapTransition()}
requestAnimationFrame(draw)}
function init(){
 $('#audioBtn').textContent=soundOn?'♫ ON':'♫ OFF';
 title();requestAnimationFrame(draw);
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();if(music)music.setMuted(true)}
  else if(music)music.setMuted(!soundOn);
 });
 window.addEventListener('pagehide',()=>{save();if(music)music.setMuted(true)});
}
init();
})();
</script>
